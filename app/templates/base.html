<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}DockSentinel{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur">
      <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
        <a href="{{ url_for('dashboard') }}" class="font-bold tracking-wide text-cyan-300">DockSentinel</a>
        <nav class="flex gap-4 text-sm">
          <a class="hover:text-cyan-300" href="{{ url_for('dashboard') }}">Dashboard</a>
          <a class="hover:text-cyan-300" href="{{ url_for('settings_page') }}">Settings</a>
          <a class="hover:text-cyan-300" href="{{ url_for('exclusions_page') }}">Exclusions</a>
          <a class="hover:text-cyan-300" href="{{ url_for('insights_page') }}">Insights</a>
          <a class="hover:text-cyan-300" href="{{ url_for('reports_page') }}">Reports</a>
          <a class="hover:text-cyan-300" href="{{ url_for('prompt_studio_page') }}">Prompt Studio</a>
        </nav>
      </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 py-6">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>

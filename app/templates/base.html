<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>{% block title %}DockSentinel{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
  </head>
  <body>
    {% set path = request.path %}
    <header class="app-header">
      <div class="app-header__inner">
        <a class="brand" href="{{ url_for('dashboard') }}">
          <span class="brand__mark" aria-hidden="true">D</span>
          <span>DockSentinel</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a class="nav__link {% if path in ('/', '/dashboard') %}nav__link--active{% endif %}" href="{{ url_for('dashboard') }}">Overview</a>
          <a class="nav__link {% if path.startswith('/insights') %}nav__link--active{% endif %}" href="{{ url_for('insights_page') }}">Events</a>
          <a class="nav__link {% if path.startswith('/reports') %}nav__link--active{% endif %}" href="{{ url_for('reports_page') }}">Reports</a>
          <a class="nav__link {% if path.startswith('/exclusions') %}nav__link--active{% endif %}" href="{{ url_for('exclusions_page') }}">Exclusions</a>
          <a class="nav__link {% if path.startswith('/prompt') %}nav__link--active{% endif %}" href="{{ url_for('prompt_studio_page') }}">Prompts</a>
          <a class="nav__link {% if path.startswith('/settings') %}nav__link--active{% endif %}" href="{{ url_for('settings_page') }}">Settings</a>
        </nav>
      </div>
    </header>
    <main class="app-main">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>

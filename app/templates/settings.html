{% extends "base.html" %}
{% block title %}DockSentinel — Settings{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Settings</h1>
    <p class="page-subtitle">LLM transport, Telegram alerts, rate limits, and scheduler configuration.</p>
  </div>
</div>

<form method="post" class="stack">
  <section class="card card--padded">
    <div class="card__header">
      <h2 class="card__title card__title--lg">LLM</h2>
      <span class="badge badge--neutral badge--no-dot">{{ settings.llm_transport }}</span>
    </div>
    <div class="field-grid">
      <label class="field">
        <span class="field__label">Transport</span>
        <select class="select" name="llm_transport">
          <option value="api" {% if settings.llm_transport == 'api' %}selected{% endif %}>api</option>
          <option value="cli" {% if settings.llm_transport == 'cli' %}selected{% endif %}>cli</option>
        </select>
      </label>
      <label class="field">
        <span class="field__label">Provider</span>
        <input class="input" name="llm_provider" value="{{ settings.llm_provider }}" />
      </label>
      <label class="field">
        <span class="field__label">Base URL</span>
        <input class="input mono" name="llm_base_url" value="{{ settings.llm_base_url }}" />
      </label>
      <label class="field">
        <span class="field__label">API key</span>
        <input class="input mono" name="llm_api_key" value="{{ settings.llm_api_key }}" type="password" />
      </label>
      <label class="field">
        <span class="field__label">Model</span>
        <input class="input mono" name="llm_model" value="{{ settings.llm_model }}" />
      </label>
      <label class="field">
        <span class="field__label">CLI backend</span>
        <select class="select" name="cli_backend">
          <option value="codex" {% if settings.cli_backend == 'codex' %}selected{% endif %}>codex</option>
          <option value="claude" {% if settings.cli_backend == 'claude' %}selected{% endif %}>claude</option>
          <option value="gemini" {% if settings.cli_backend == 'gemini' %}selected{% endif %}>gemini</option>
          <option value="ollama" {% if settings.cli_backend == 'ollama' %}selected{% endif %}>ollama</option>
        </select>
      </label>
      <label class="field">
        <span class="field__label">CLI timeout (s)</span>
        <input class="input tabular" type="number" min="1" name="cli_timeout_seconds" value="{{ settings.cli_timeout_seconds }}" />
      </label>
      <label class="field">
        <span class="field__label">CLI max retries</span>
        <input class="input tabular" type="number" min="0" name="cli_max_retries" value="{{ settings.cli_max_retries }}" />
      </label>
      <label class="field">
        <span class="field__label">LLM timeout (s)</span>
        <input class="input tabular" type="number" name="llm_timeout_seconds" value="{{ settings.llm_timeout_seconds }}" />
      </label>
      <label class="field">
        <span class="field__label">LLM max retries</span>
        <input class="input tabular" type="number" name="llm_max_retries" value="{{ settings.llm_max_retries }}" />
      </label>
    </div>
  </section>

  <section class="card card--padded">
    <div class="card__header">
      <h2 class="card__title card__title--lg">Input budgets</h2>
    </div>
    <div class="field-grid">
      <label class="field">
        <span class="field__label">Max input chars</span>
        <input class="input tabular" type="number" name="max_input_chars" value="{{ settings.max_input_chars }}" />
      </label>
      <label class="field">
        <span class="field__label">Max input tokens</span>
        <input class="input tabular" type="number" name="max_input_tokens" value="{{ settings.max_input_tokens }}" />
      </label>
      <label class="field">
        <span class="field__label">Reserved output tokens</span>
        <input class="input tabular" type="number" name="reserved_output_tokens" value="{{ settings.reserved_output_tokens }}" />
      </label>
      <label class="field">
        <span class="field__label">Token strategy</span>
        <select class="select" name="token_estimation_strategy">
          <option value="chars" {% if settings.token_estimation_strategy == 'chars' %}selected{% endif %}>chars</option>
          <option value="tiktoken" {% if settings.token_estimation_strategy == 'tiktoken' %}selected{% endif %}>tiktoken</option>
        </select>
      </label>
      <label class="field field-grid__wide">
        <span class="field__label">Keyword list</span>
        <input class="input mono" name="keyword_list" value="{{ settings.keyword_list }}" />
      </label>
    </div>
  </section>

  <section class="card card--padded">
    <div class="card__header">
      <h2 class="card__title card__title--lg">Alerts &amp; rate limits</h2>
    </div>
    <div class="field-grid">
      <label class="field">
        <span class="field__label">Telegram token</span>
        <input class="input mono" name="telegram_token" value="{{ settings.telegram_token or '' }}" type="password" />
      </label>
      <label class="field">
        <span class="field__label">Telegram chat id</span>
        <input class="input mono" name="telegram_chat_id" value="{{ settings.telegram_chat_id or '' }}" />
      </label>
      <label class="field">
        <span class="field__label">Alert cooldown (min)</span>
        <input class="input tabular" type="number" name="alert_cooldown_minutes" value="{{ settings.alert_cooldown_minutes }}" />
      </label>
      <label class="field">
        <span class="field__label">Alert rate-limit count</span>
        <input class="input tabular" type="number" name="alert_rate_limit_count" value="{{ settings.alert_rate_limit_count }}" />
      </label>
      <label class="field">
        <span class="field__label">Alert rate window (s)</span>
        <input class="input tabular" type="number" name="alert_rate_limit_window_seconds" value="{{ settings.alert_rate_limit_window_seconds }}" />
      </label>
      <label class="field">
        <span class="field__label">Dedup window (s)</span>
        <input class="input tabular" type="number" min="0" name="dedup_window_seconds" value="{{ settings.dedup_window_seconds }}" />
      </label>
      <label class="field">
        <span class="field__label">Container rate count</span>
        <input class="input tabular" type="number" min="1" name="container_rate_limit_count" value="{{ settings.container_rate_limit_count }}" />
      </label>
      <label class="field">
        <span class="field__label">Container rate window (s)</span>
        <input class="input tabular" type="number" min="60" name="container_rate_limit_window_seconds" value="{{ settings.container_rate_limit_window_seconds }}" />
      </label>
      <label class="field">
        <span class="field__label">Keyword flush delay (lines)</span>
        <input class="input tabular" type="number" min="0" name="keyword_flush_delay_lines" value="{{ settings.keyword_flush_delay_lines }}" />
      </label>
      <label class="field field-grid__wide">
        <span class="field__label">Coalesce window (seconds) — hold matched chunks per container; 0 disables</span>
        <input class="input tabular" type="number" min="0" name="chunk_coalesce_window_seconds" value="{{ settings.chunk_coalesce_window_seconds }}" />
      </label>
    </div>
  </section>

  <section class="card card--padded">
    <div class="card__header">
      <h2 class="card__title card__title--lg">Scheduler</h2>
    </div>
    <div class="field-grid">
      <label class="field">
        <span class="field__label">Nightly hour (0–23)</span>
        <input class="input tabular" type="number" min="0" max="23" name="nightly_hour" value="{{ settings.nightly_hour }}" />
      </label>
      <label class="field">
        <span class="field__label">Nightly minute (0–59)</span>
        <input class="input tabular" type="number" min="0" max="59" name="nightly_minute" value="{{ settings.nightly_minute }}" />
      </label>
    </div>
  </section>

  <div class="row row--wrap" style="gap: 10px;">
    <button class="btn btn--primary">Save settings</button>
    <button type="button" id="btn-test-llm" class="btn">Test LLM</button>
    <button type="button" id="btn-test-telegram" class="btn">Test Telegram</button>
    <div id="settings-test-output" class="inline-output" style="flex: 1; min-width: 260px;"></div>
  </div>
</form>
{% endblock %}
